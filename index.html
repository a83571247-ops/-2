<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>생명과학 게임 - 흥분 전도 단계</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Malgun Gothic', sans-serif;
            user-select: none;
        }
        /* 상단 UI 레이아웃 */
        #uiContainer {
            width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        /* 제한시간 게이지 바 */
        #gaugeContainer {
            width: 250px;
            height: 16px;
            background-color: #222;
            border: 2px solid #fff;
            border-radius: 8px;
            overflow: hidden;
        }
        #gaugeBar {
            width: 100%;
            height: 100%;
            background-color: #00ffcc;
        }
        canvas {
            background-color: #111424;
            border: 3px solid #3f48cc;
            box-shadow: 0 0 20px rgba(63, 72, 204, 0.5);
            border-radius: 8px;
        }
        /* 하단 버튼 UI 스타일 */
        #buttonContainer {
            width: 800px;
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
        }
        .game-btn {
            width: 180px;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            color: black;
            box-shadow: 0 5px #666;
            transition: all 0.1s;
        }
        .game-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px #666;
        }
        #naBtn { background-color: #39ff14; } /* 나트륨 연두색 */
        #kBtn { background-color: #ffea00; }  /* 칼륨 노란색 */
    </style>
</head>
<body>

    <div id="uiContainer">
        <div>현재 점수: <span id="scoreDisplay">0</span> 점</div>
        <div style="font-size: 14px; color: #aaa;">[1번] 이나 [2번] 키를 누르거나 하단 버튼을 클릭하세요!</div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <span id="timerLabel">제한시간 (0.50초)</span>
            <div id="gaugeContainer">
                <div id="gaugeBar"></div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div id="buttonContainer">
        <button id="naBtn" class="game-btn" onclick="handleInput('Na')">나트륨 (1번)</button>
        <button id="kBtn" class="game-btn" onclick="handleInput('K')">칼륨 (2번)</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // [게임 및 캐릭터 상태 변수]
        // 💡 첫 번째 발판 위치인 380에 안착한 상태로 시작하도록 세팅하여 버그 수정!
        let player = { x: 380, y: 190, radius: 14, targetX: 380, speed: 12 };
        let cameraX = player.x - 120;
        let score = 0;

        // [시간 관리 시스템 변수]
        let baseTimeLimit = 500; // 기본 제한시간 0.5초 (500밀리초)
        let currentTimeLimit = 500; 
        let timeElapsed = 0;    
        let lastTime = performance.now();

        // [무한 맵 발판 데이터 생성]
        let blocks = [];
        let nextBlockX = 350;
        let currentBlockIndex = 0;

        function generateBlock() {
            let types = ['Na', 'K'];
            let randomType = types[Math.floor(Math.random() * types.length)];
            let color = (randomType === 'Na') ? '#39ff14' : '#ffea00';
            
            blocks.push({
                x: nextBlockX,
                type: randomType,
                color: color,
                isMyelin: Math.random() > 0.4
            });
            nextBlockX += 260;
        }

        // 초기 시작 발판 10개 배치
        for(let i = 0; i < 10; i++) { generateBlock(); }

        // [키보드 입력 연동]
        window.addEventListener('keydown', (e) => {
            if (e.key === '1') handleInput('Na');
            if (e.key === '2') handleInput('K');
        });

        // [핵심 판정 로직]
        function handleInput(pressedType) {
            // 캐릭터가 전진 이동 중일 때는 중복 입력 방지
            if (player.x !== player.targetX) return;

            let targetBlock = blocks[currentBlockIndex];

            // 1. 성공 판정
            if (pressedType === targetBlock.type) {
                score++;
                document.getElementById('scoreDisplay').innerText = score;
                
                // 💡 [규칙 반영] 10의 배수로 점수가 커질수록 제한시간 0.1초(100ms)씩 감소 (최소 0.1초 유지)
                let level = Math.floor(score / 10);
                currentTimeLimit = Math.max(100, baseTimeLimit - (level * 100));
                document.getElementById('timerLabel').innerText = `제한시간 (${(currentTimeLimit/1000).toFixed(2)}초)`;

                // 다음 발판 위치로 타겟 설정 및 인덱스 증가
                currentBlockIndex++;
                let nextTargetBlock = blocks[currentBlockIndex];
                player.targetX = nextTargetBlock.x + 30; 
                
                // 정답을 맞추면 타이머를 즉시 0으로 초기화
                timeElapsed = 0;

                generateBlock();
            } 
            // 2. 오답 판정
            else {
                triggerGameOver("잘못된 이온 버튼을 눌렀습니다!");
            }
        }

        function triggerGameOver(message) {
            alert("게임 오버! \n이유: " + message + "\n최종 점수: " + score + "점");
            resetGame();
        }

        function resetGame() {
            score = 0;
            currentTimeLimit = baseTimeLimit;
            timeElapsed = 0;
            
            blocks = [];
            nextBlockX = 350;
            currentBlockIndex = 0;
            for(let i =
