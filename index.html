<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>뉴런 러너 - 코어 단계</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 400px;
            background-color: #2b2b2b;
            border: 4px solid #444;
            border-radius: 10px;
            overflow: hidden;
        }
        /* 주인공 캐릭터 */
        #character {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: #ff9f43;
            border-radius: 50%;
            bottom: 60px;
            left: 100px;
            transition: left 0.2s ease, bottom 0.1s ease;
            z-index: 10;
        }
        /* 발판들이 배치될 가로 줄 전체 박스 */
        #platforms-wrapper {
            position: absolute;
            bottom: 0;
            left: 0;
            display: flex;
            transition: left 0.2s ease;
        }
        .platform {
            width: 120px;
            height: 50px;
            margin-right: 30px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: #2b2b2b;
        }
        /* 요구사항 반영 이온 색상 */
        .sodium { background-color: #f1c40f; }    /* 노랑: 나트륨 */
        .potassium { background-color: #2ecc71; } /* 초록: 칼륨 */
        
        #ui-layer {
            margin-top: 20px;
            text-align: center;
        }
        .key-guide {
            display: inline-block;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>점수: <span id="score">0</span></h1>

    <div id="game-container">
        <div id="character"></div>
        <div id="platforms-wrapper"></div>
    </div>

    <!-- 새롭게 매칭된 조작 가이드 UI -->
    <div id="ui-layer">
        <h3>[현재 단계] 올바른 이온 키를 눌러 전진하세요!</h3>
        <span class="key-guide potassium" style="color: white;">초록색 발판 떴을 때 ➔ [1] 키</span>
        <span class="key-guide sodium">노란색 발판 떴을 때 ➔ [2] 키</span>
    </div>

    <script>
        const charElem = document.getElementById('character');
        const wrapperElem = document.getElementById('platforms-wrapper');
        const scoreElem = document.getElementById('score');

        let score = 0;
        let currentIndex = 0; // 캐릭터가 디딛고 있는 현재 발판 위치
        let platforms = [];   // 무작위로 생성될 발판들의 색상 저장소

        // 1단계: 100개의 발판 무작위 패턴 생성 및 배치
        function initGame() {
            score = 0;
            currentIndex = 0;
            scoreElem.innerText = score;
            wrapperElem.innerHTML = '';
            platforms = [];

            // 캐릭터 시작 지점 (첫 발판은 무조건 노란색 고정)
            platforms.push('sodium');

            // 1번부터 99번 발판까지 노랑(sodium) 또는 초록(potassium) 무작위 결정
            for(let i = 1; i < 100; i++) {
                const type = Math.random() > 0.5 ? 'sodium' : 'potassium';
                platforms.push(type);
            }

            // 루프를 돌며 HTML 화면에 발판 실물 그리기
            platforms.forEach((type, index) => {
                const plat = document.createElement('div');
                plat.className = `platform ${type}`;
                plat.innerText = type === 'sodium' ? '나트륨(2)' : '칼륨(1)';
                plat.style.position = 'absolute';
                // 발판 너비(120px) + 간격(30px) = 150px씩 우측으로 배치
                plat.style.left = `${index * 150}px`; 
                wrapperElem.appendChild(plat);
            });

            // 초기 위치 세팅
            wrapperElem.style.left = '0px';
        }

        // 2단계: 키보드 입력 및 조건문 판정 시스템
        window.addEventListener('keydown', (e) => {
            // 다음에 밟아야 할 발판의 인덱스와 타깃 색상 확인
            const nextIndex = currentIndex + 1;
            
            // 100개 발판을 다 깨면 안전하게 종료
            if (nextIndex >= platforms.length) return; 
            
            const nextPlatformType = platforms[nextIndex];
            const pressedKey = e.key; // 유저가 누른 키 값 받기

            let isCorrect = false;

            // 핵심 조건문 분기 설계
            if (nextPlatformType === 'potassium' && pressedKey === '1') {
                isCorrect = true; // 초록 발판일 때 1번 통과
            } else if (nextPlatformType === 'sodium' && pressedKey === '2') {
                isCorrect = true; // 노란 발판일 때 2번 통과
            }

            // 조건 통과 시 캐릭터 자동 점프 및 카메라 이동 연동
            if (isCorrect) {
                currentIndex = nextIndex;
                score++;
                scoreElem.innerText = score;

                // 통통 튀는 점프 애니메이션 (Y축 좌표 제어)
                charElem.style.bottom = '110px';
                setTimeout(() => {
                    charElem.style.bottom = '60px';
                }, 100);

                // 카메라 추적: 발판 묶음을 한 칸 분량(-150px)만큼 왼쪽으로 당김
                wrapperElem.style.left = `${-currentIndex * 150}px`;
            }
        });

        // 웹페이지가 로드되면 즉시 실행
        initGame();
    </script>
</body>
</html>
