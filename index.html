<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>생명과학 게임 - 통합 단계</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Malgun Gothic', sans-serif;
            user-select: none;
            touch-action: manipulation;
        }
        #uiContainer {
            width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        #gaugeContainer {
            width: 250px;
            height: 16px;
            background-color: #222;
            border: 2px solid #fff;
            border-radius: 8px;
            overflow: hidden;
            display: block;
        }
        #gaugeBar {
            width: 100%;
            height: 100%;
            background-color: #00ffcc; 
            display: block;
            transition: width 0.05s linear;
        }
        canvas {
            background-color: #111424;
            border: 3px solid #3f48cc;
            box-shadow: 0 0 20px rgba(63, 72, 204, 0.5);
            border-radius: 8px;
        }
        #buttonContainer {
            width: 800px;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .game-btn {
            width: 150px;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border: 2px solid #fff;
            border-radius: 25px;
            cursor: pointer;
            color: black;
            box-shadow: 0 5px #666;
            transition: all 0.1s;
        }
        .game-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px #666;
        }
        #naBtn   { background-color: #39ff14; color: black; } 
        #kBtn    { background-color: #ffea00; color: black; }  
        #redBtn  { background-color: #ff3333; color: white; text-shadow: 1px 1px 1px #000; } 
        #blueBtn { background-color: #3333ff; color: white; text-shadow: 1px 1px 1px #000; } 
        #yellowBtn { background-color: #ffea00; color: black; } 

        .game-btn:disabled {
            background-color: #555 !important;
            color: #888 !important;
            border-color: #333;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
            text-shadow: none !important;
        }
    </style>
</head>
<body>

    <div id="uiContainer">
        <div>현재 점수: <span id="scoreDisplay">0</span> 점 <span id="stageInfo" style="color:#00ffcc; margin-left:10px;">(흥분 전도)</span></div>
        <div id="guideText" style="font-size: 14px; color: #aaa;">[1번] 나트륨 개방 / [2번] 칼륨 개방</div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <span id="timerLabel">제한시간 (1.50초)</span>
            <div id="gaugeContainer">
                <div id="gaugeBar">&nbsp;</div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div id="buttonContainer">
        <button id="naBtn" class="game-btn" onclick="handleScene1Input('Na')">나트륨 (1)</button>
        <button id="kBtn" class="game-btn" onclick="handleScene1Input('K')">칼륨 (2)</button>
        <button id="redBtn" class="game-btn" onclick="pressScene2Button('Red')" disabled>빨강 수용체 (3)</button>
        <button id="blueBtn" class="game-btn" onclick="pressScene2Button('Blue')" disabled>파랑 수용체 (4)</button>
        <button id="yellowBtn" class="game-btn" onclick="pressScene2Button('Yellow')" disabled>노랑 수용체 (6)</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 게임 상태 관리
        let currentPhase = 'SCENE1'; // 'SCENE1', 'SCENE2_ARRIVE', 'SCENE2_PATTERN', 'SCENE2_INPUT', 'SUCCESS'
        let isGameOver = false;
        let score = 0;
        let lastTime = Date.now();
        let timeElapsed = 0;

        // --- 장면 1 (전도 페이즈) 변수 ---
        let player = { x: 380, y: 190, radius: 14, targetX: 380, speed: 15 };
        let cameraX = 0;
        let baseTimeLimit = 1500;
        let currentTimeLimit = 1500; 
        let blocks = [];
        let nextBlockX = 350;
        let currentBlockIndex = 0;
        const TARGET_SCORE_TO_SYNAPSE = 25; // 원하시는 대로 25점에 시냅스 전환 설정

        // --- 장면 2 (시냅스 페이즈) 변수 ---
        const scene2TimeLimit = 5000; // 입력 단계 5초 부여
        const TYPE_INFO = {
            'Red':    { color: '#ff3333', key: '3', name: '빨강(3)' },
            'Blue':   { color: '#3333ff', key: '4', name: '파랑(4)' },
            'Yellow': { color: '#ffea00', key: '6', name: '노랑(6)' }
        };
        const TYPES = ['Red', 'Blue', 'Yellow'];
        let patternSequence = []; 
        let playerInputIndex = 0; 
        let patternTimer = 0;
        let currentFlashIndex = -1; 
        let isPostNeuronGlowing = false;
        let successTimer = 0;

        // 키보드 이벤트 매핑 수정
        window.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            if (currentPhase === 'SCENE1') {
                if (e.key === '1') handleScene1Input('Na');
                if (e.key === '2') handleScene1Input('K');
            } else if (currentPhase === 'SCENE2_INPUT') {
                if (e.key === '3') pressScene2Button('Red');
                if (e.key === '4') pressScene2Button('Blue');
                if (e.key === '6') pressScene2Button('Yellow');
            }
        });

        function generateBlock() {
            let types = ['Na', 'K'];
            let randomType = types[Math.floor(Math.random() * types.length)];
            blocks.push({
                x: nextBlockX,
                type: randomType,
                color: (randomType === 'Na') ? '#39ff14' : '#ffea00',
                isMyelin: Math.random() > 0.4
            });
            nextBlockX += 260;
        }

        function handleScene1Input(pressedType) {
            if (isGameOver || currentPhase !== 'SCENE1') return;
            if (player.x !== player.targetX) return; 

            let targetBlock = blocks[currentBlockIndex];

            if (pressedType === targetBlock.type) {
                score++;
                document.getElementById('scoreDisplay').innerText = score;

                if (score >= TARGET_SCORE_TO_SYNAPSE) {
                    currentPhase = 'SCENE2_ARRIVE';
                    player.targetX = player.x + 200;
                    timeElapsed = 0;
                    return;
                }

                let level = Math.floor(score / 5);
                currentTimeLimit = Math.max(500, baseTimeLimit - (level * 100));
                document.getElementById('timerLabel').innerText = `제한시간 (${(currentTimeLimit/1000).toFixed(2)}초)`;

                currentBlockIndex++;
                let nextTargetBlock = blocks[currentBlockIndex];
                player.targetX = nextTargetBlock.x + 30; 
                timeElapsed = 0; 
                generateBlock();
            } else {
                triggerGameOver("잘못된 이온 버튼을 눌렀습니다!");
            }
        }

        function startSynapsePhase() {
            currentPhase = 'SCENE2_PATTERN';
            document.getElementById('stageInfo').innerText = '(시냅스 전달)';
            document.getElementById('stageInfo').style.color = '#ff3333';
            document.getElementById('guideText').innerText = '안테나 수용체의 활성화 색상 순서를 기억하세요!';
            
            // 무작위 3색 수용체 배치 생성
            patternSequence = [];
            for (let i = 0; i < 3; i++) {
                patternSequence.push(TYPES[Math.floor(Math.random() * TYPES.length)]);
            }
            
            patternTimer = 0;
            currentFlashIndex = 0; 
            timeElapsed = 0;
        }

        function pressScene2Button(type) {
            if (currentPhase !== 'SCENE2_INPUT' || isGameOver) return;

            if (patternSequence[playerInputIndex] === type) {
                playerInputIndex++;
                score += 3; // 시냅스 결합 성공 시 가산점
                document.getElementById('scoreDisplay').innerText = score;

                if (playerInputIndex >= patternSequence.length) {
                    currentPhase = 'SUCCESS';
                    isPostNeuronGlowing = true;
                    successTimer = 0;
                    document.getElementById('gaugeBar').style.width = '100%';
                    document.getElementById('guideText').innerText = '💡 신경전달물질 결합 성공! 자극이 다음 뉴런으로 전달됩니다!';
                }
            } else {
                triggerGameOver("수용체와 맞지 않는 키를 입력하여 전달에 실패했습니다!");
            }
        }

        function toggleButtons(phase) {
            const sc1 = (phase === 'SCENE1');
            const sc2 = (phase === 'SCENE2_INPUT');
            
            document.getElementById('naBtn').disabled = !sc1;
            document.getElementById('kBtn').disabled = !sc1;
            document.getElementById('redBtn').disabled = !sc2;
            document.getElementById('blueBtn').disabled = !sc2;
            document.getElementById('yellowBtn').disabled = !sc2;
        }

        function triggerGameOver(message) {
            if (isGameOver) return;
            isGameOver = true;
            document.getElementById('gaugeBar').style.width = '0%';
            setTimeout(() => {
                alert("게임 오버! \n이유: " + message + "\n최종 점수: " + score + "점");
                resetGame();
            }, 10);
        }

        function resetGame() {
            currentPhase = 'SCENE1';
            isGameOver = false;
            score = 0;
            timeElapsed = 0;
            currentTimeLimit = baseTimeLimit;
            currentBlockIndex = 0;
            nextBlockX = 350;
            
            blocks = [];
            for(let i = 0; i < 35; i++) { generateBlock(); }

            player = { x: blocks[0].x + 30, y: 190, radius: 14, targetX: blocks[0].x + 30, speed: 15 };
            cameraX = player.x - 120;

            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('stageInfo').innerText = '(흥분 전도)';
            document.getElementById('stageInfo').style.color = '#00ffcc';
            document.getElementById('guideText').innerText = '[1번] 나트륨 개방 / [2번] 칼륨 개방';
            document.getElementById('timerLabel').innerText = `제한시간 (${(baseTimeLimit/1000).toFixed(2)}초)`;
            document.getElementById('gaugeBar').style.width = '100%';
            document.getElementById('gaugeBar').style.backgroundColor = '#00ffcc';

            toggleButtons('SCENE1');
            lastTime = Date.now();
            animate();
        }

        // 안테나 모양 수용체 그리기 헬퍼 함수
        function drawAntennaReceptor(x, y, color, isGlowing, label) {
            ctx.save();
            // 수용체 지지대 틀
            ctx.strokeStyle = '#555875';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - 25, y);
            ctx.stroke();

            // 안테나 반원형 접시 모양 (수용체 구조 표현)
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            if (isGlowing) {
                ctx.shadowBlur = 15;
                ctx.shadowColor = color;
            }
            ctx.beginPath();
            ctx.arc(x - 25, y, 16, -Math.PI / 2, Math.PI / 2, true);
            ctx.stroke();

            // 안테나 중심 수신 침
            ctx.fillStyle = color;
            ctx.fillRect(x - 33, y - 2, 8, 4);

            // 가이드 텍스트 라벨 (키 번호 표시)
            ctx.fillStyle = '#ffffff';
            ctx.font = '11px sans-serif';
            ctx.fillText(label, x + 15, y + 4);
            ctx.restore();
        }

        function animate() {
            if (isGameOver) return;

            let now = Date.now();
            let dt = now - lastTime;
            lastTime = now;

            toggleButtons(currentPhase);

            // --- 비즈니스 업데이트 로직 ---
            if (currentPhase === 'SCENE1') {
                if (player.x < player.targetX) {
                    player.x += player.speed;
                    if (player.x > player.targetX) player.x = player.targetX;
                }
                cameraX = player.x - 120;

                if (player.x === player.targetX) {
                    timeElapsed += dt;
                    let pct = Math.max(0, 100 - (timeElapsed / currentTimeLimit) * 100);
                    document.getElementById('gaugeBar').style.width = pct + '%';
                    if (timeElapsed >= currentTimeLimit) {
                        triggerGameOver("시간 안에 이온 통로를 개방하지 못했습니다!");
                        return;
                    }
                } else {
                    document.getElementById('gaugeBar').style.width = '100%';
                }
            } 
            else if (currentPhase === 'SCENE2_ARRIVE') {
                if (player.x < player.targetX) {
                    player.x += 8;
                    cameraX += 6;
                } else {
                    startSynapsePhase();
                }
                document.getElementById('gaugeBar').style.width = '100%';
            } 
            else if (currentPhase === 'SCENE2_PATTERN') {
                document.getElementById('gaugeBar').style.backgroundColor = '#ff3333';
                patternTimer += dt;
                
                if (patternTimer > 900) { // 인지할 수 있도록 패턴 플래시 시간 약간 상향
                    patternTimer = 0;
                    currentFlashIndex++;
                    if (currentFlashIndex >= patternSequence.length) {
                        currentPhase = 'SCENE2_INPUT';
                        currentFlashIndex = -1;
                        timeElapsed = 0;
                        playerInputIndex = 0;
                        document.getElementById('guideText').innerText = '매칭되는 안테나 수용체 키 [빨강:3] [파랑:4] [노랑:6] 을 차례대로 누르세요!';
                    }
                }
                document.getElementById('gaugeBar').style.width = '100%';
            } 
            else if (currentPhase === 'SCENE2_INPUT') {
                timeElapsed += dt;
                let pct = Math.max(0, 100 - (timeElapsed / scene2TimeLimit) * 100);
                document.getElementById('gaugeBar').style.width = pct + '%';
                document.getElementById('timerLabel').innerText = `제한시간 (${((scene2TimeLimit - timeElapsed)/1000).toFixed(2)}초)`;

                if (timeElapsed >= scene2TimeLimit) {
                    triggerGameOver("신경전달물질 결합 제한 시간이 초과되었습니다!");
                    return;
                }
            } 
            else if (currentPhase === 'SUCCESS') {
                successTimer += dt;
                if (successTimer > 2000) {
                    currentPhase = 'SCENE1';
                    isPostNeuronGlowing = false;
                    baseTimeLimit = Math.max(400, baseTimeLimit - 100); 
                    score += 15; 
                    resetGame();
                    return;
                }
            }

            // --- 캔버스 그래픽 렌더링 ---
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (currentPhase === 'SCENE1' || currentPhase === 'SCENE2_ARRIVE') {
                ctx.save();
                ctx.translate(-cameraX, 0);

                // 축삭선 신경세포막
                ctx.strokeStyle = '#2d325a';
                ctx.lineWidth = 6;
                ctx.beginPath(); ctx.moveTo(0, 200); ctx.lineTo(player.x + 1200, 200); ctx.stroke();

                blocks.forEach((b, idx) => {
                    if (b.isMyelin && idx !== currentBlockIndex) {
                        ctx.fillStyle = '#3a3f58';
                        ctx.fillRect(b.x - 120, 185, 100, 30);
                    }
                    ctx.fillStyle = b.color;
                    if (idx === currentBlockIndex) { ctx.shadowBlur = 15; ctx.shadowColor = b.color; }
                    ctx.fillRect(b.x, 190, 60, 20);
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = '#000000';
                    ctx.font = 'bold 12px sans-serif';
                    ctx.fillText(b.type === 'Na' ? 'Na+' : 'K+', b.x + 15, 205);

                    if (idx === currentBlockIndex) {
                        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 18px sans-serif';
                        ctx.fillText('▼', b.x + 20, 175);
                    }
                });

                ctx.fillStyle = '#00e5ff'; ctx.shadowBlur = 10; ctx.shadowColor = '#00e5ff';
                ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            } 
            else {
                // 2단계: 시냅스 전달 시각화 화면
                // 시냅스 전 뉴런 말단
                ctx.fillStyle = '#222845';
                ctx.beginPath(); ctx.arc(150, 200, 120, -Math.PI/2, Math.PI/2); ctx.fill();
                ctx.fillRect(0, 80, 150, 240);

                // 시냅스 후 뉴런 세포체
                ctx.fillStyle = isPostNeuronGlowing ? '#00ffcc' : '#1b2234';
                if (isPostNeuronGlowing) { ctx.shadowBlur = 25; ctx.shadowColor = '#00ffcc'; }
                ctx.beginPath(); ctx.arc(650, 200, 120, Math.PI/2, -Math.PI/2); ctx.fill();
                ctx.fillRect(650, 80, 150, 240);
                ctx.shadowBlur = 0;

                // 시냅스 틈 간격 구조선
                ctx.strokeStyle = '#3f48cc'; ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.beginPath(); ctx.moveTo(270, 50); ctx.lineTo(270, 350); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(520, 50); ctx.lineTo(520, 350); ctx.stroke();
                ctx.setLineDash([]);

                // 화면 중앙 상단: 현재 외워야 하거나 입력 중인 패턴 시각 자료 피드백
                patternSequence.forEach((type, idx) => {
                    let info = TYPE_INFO[type];
                    let isActive = (idx === currentFlashIndex || currentPhase === 'SCENE2_INPUT');
                    
                    if (currentPhase === 'SCENE2_INPUT' && idx < playerInputIndex) {
                        ctx.fillStyle = '#22263f'; // 완료 항목 디밍
                    } else {
                        ctx.fillStyle = isActive ? info.color : '#333';
                    }
                    ctx.fillRect(330 + (idx * 60), 25, 45, 30);
                    
                    ctx.fillStyle = (currentPhase === 'SCENE2_INPUT' && idx < playerInputIndex) ? '#555' : '#fff';
                    ctx.font = 'bold 11px sans-serif';
                    ctx.fillText(info.name, 335 + (idx * 60), 44);
                });

                // 시냅스 틈 사이의 화학 물질(신경전달물질 소포 및 수용체 연출)
                patternSequence.forEach((type, idx) => {
                    let info = TYPE_INFO[type];
                    let targetY = 120 + (idx * 75);

                    // 1. 시냅스 전 뉴런 내부 소포 주머니 표현
                    ctx.strokeStyle = '#888'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(180, targetY, 18, 0, Math.PI*2); ctx.stroke();
                    ctx.fillStyle = info.color;
                    ctx.beginPath(); ctx.arc(180, targetY, 9, 0, Math.PI*2); ctx.fill();

                    // 2. 입력에 성공하면 전달물질이 방출되어 결합하는 애니메이션 효과 구현
                    if (currentPhase === 'SCENE2_INPUT' && idx < playerInputIndex) {
                        ctx.fillStyle = info.color;
                        ctx.shadowBlur = 10; ctx.shadowColor = info.color;
                        ctx.beginPath(); ctx.arc(480, targetY, 10, 0, Math.PI*2); ctx.fill();
                        ctx.shadowBlur = 0;
                    }

                    // 3. 시냅스 후 뉴런에 부착된 [안테나 모양 단백질 수용체 3개] 렌더링
                    let isGlowing = (currentPhase === 'SCENE2_INPUT' && idx === playerInputIndex) || (currentPhase === 'SCENE2_PATTERN' && idx === currentFlashIndex);
                    drawAntennaReceptor(530, targetY, info.color, isGlowing, info.name);
                });
            }

            requestAnimationFrame(animate);
        }

        resetGame();
    </script>
</body>
</html>
