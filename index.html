<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>생명과학 게임 - 흥분 전도 단계</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Malgun Gothic', sans-serif;
            user-select: none;
        }
        /* 상단 UI 레이아웃 */
        #uiContainer {
            width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        /* 제한시간 게이지 바 */
        #gaugeContainer {
            width: 250px;
            height: 16px;
            background-color: #222;
            border: 2px solid #fff;
            border-radius: 8px;
            overflow: hidden;
        }
        #gaugeBar {
            width: 100%;
            height: 100%;
            background-color: #00ffcc;
            transition: width 0.05s linear; /* 게이지 감소를 부드럽게 연출 */
        }
        canvas {
            background-color: #111424;
            border: 3px solid #3f48cc;
            box-shadow: 0 0 20px rgba(63, 72, 204, 0.5);
            border-radius: 8px;
        }
        /* 하단 버튼 UI 스타일 */
        #buttonContainer {
            width: 800px;
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
        }
        .game-btn {
            width: 180px;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            color: black;
            box-shadow: 0 5px #666;
            transition: all 0.1s;
        }
        .game-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px #666;
        }
        #naBtn { background-color: #39ff14; } /* 나트륨 연두색 */
        #kBtn { background-color: #ffea00; }  /* 칼륨 노란색 */
    </style>
</head>
<body>

    <div id="uiContainer">
        <div>현재 점수: <span id="scoreDisplay">0</span> 점</div>
        <div style="font-size: 14px; color: #aaa;">[1번] 이나 [2번] 키를 누르거나 하단 버튼을 클릭하세요!</div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <span id="timerLabel">제한시간 (0.50초)</span>
            <div id="gaugeContainer">
                <div id="gaugeBar"></div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div id="buttonContainer">
        <button id="naBtn" class="game-btn" onclick="handleInput('Na')">나트륨 (1번)</button>
        <button id="kBtn" class="game-btn" onclick="handleInput('K')">칼륨 (2번)</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // [게임 및 캐릭터 상태 변수]
        // 💡 캐릭터 전진이 눈에 보이도록 속도를 조정하여 타이머 공백 현상을 해결했습니다.
        let player = { x: 350 + 30, y: 190, radius: 14, targetX: 350 + 30, speed: 15 };
        let cameraX = player.x - 120;
        let score = 0;
        let isGameOver = false; 

        // [시간 관리 시스템 변수]
        let baseTimeLimit = 1500; // 초기 제한시간을 조금 더 현실적인 1.5초로 조정 (원하시면 수정 가능)
        let currentTimeLimit = 1500; 
        let timeElapsed = 0;    
        let lastTime = Date.now(); 

        // [무한 맵 발판 데이터 생성]
        let blocks = [];
        let nextBlockX = 350;
        let currentBlockIndex = 0;

        function generateBlock() {
            let types = ['Na', 'K'];
            let randomType = types[Math.floor(Math.random() * types.length)];
            let color = (randomType === 'Na') ? '#39ff14' : '#ffea00';
            
            blocks.push({
                x: nextBlockX,
                type: randomType,
                color: color,
                isMyelin: Math.random() > 0.4
            });
            nextBlockX += 260;
        }

        // 초기 시작 발판 10개 배치
        for(let i = 0; i < 10; i++) { generateBlock(); }

        // 첫 시작 위치 정렬
        player.x = blocks[0].x + 30;
        player.targetX = blocks[0].x + 30;

        // [키보드 입력 연동]
        window.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            if (e.key === '1') handleInput('Na');
            if (e.key === '2') handleInput('K');
        });

        // [핵심 판정 로직]
        function handleInput(pressedType) {
            if (isGameOver) return;
            if (player.x !== player.targetX) return; // 이동 중 입력 차단

            let targetBlock = blocks[currentBlockIndex];

            // 1. 성공 판정
            if (pressedType === targetBlock.type) {
                score++;
                document.getElementById('scoreDisplay').innerText = score;
                
                // 난이도 조절 (10점당 0.2초씩 감소, 최소 0.4초 제한)
                let level = Math.floor(score / 10);
                currentTimeLimit = Math.max(400, baseTimeLimit - (level * 200));
                document.getElementById('timerLabel').innerText = `제한시간 (${(currentTimeLimit/1000).toFixed(2)}초)`;

                currentBlockIndex++;
                let nextTargetBlock = blocks[currentBlockIndex];
                player.targetX = nextTargetBlock.x + 30; 
                
                timeElapsed = 0; // 다음 발판을 위한 타이머 초기화

                generateBlock();
            } 
            // 2. 오답 판정
            else {
                triggerGameOver("잘못된 이온 버튼을 눌렀습니다!");
            }
        }

        function triggerGameOver(message) {
            if (isGameOver) return;
            isGameOver = true; 
            
            document.getElementById('gaugeBar').style.width = '0%';
            
            setTimeout(() => {
                alert("게임 오버! \n이유: " + message + "\n최종 점수: " + score + "점");
                resetGame();
            }, 10);
        }

        function resetGame() {
            score = 0;
            currentTimeLimit = baseTimeLimit;
            timeElapsed = 0;
            
            blocks = [];
            nextBlockX = 350;
            currentBlockIndex = 0;
            for(let i = 0; i < 10; i++) { generateBlock(); }

            player = { x: blocks[0].x + 30, y: 190, radius: 14, targetX: blocks[0].x + 30, speed: 15 };
            cameraX = player.x - 120;

            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('timerLabel').innerText = `제한시간 (${(baseTimeLimit/1000).toFixed(2)}초)`;
            document.getElementById('gaugeBar').style.width = '100%';
            
            isGameOver = false; 
            lastTime = Date.now();
            animate(); 
        }

        // [메인 게임 루프]
        function animate() {
            if (isGameOver) return; 

            let now = Date.now();
            let dt = now - lastTime;
            lastTime = now;

            // 캐릭터 이동 로직
            if (player.x < player.targetX) {
                player.x += player.speed;
                if (player.x > player.targetX) {
                    player.x = player.targetX;
                }
            }

            cameraX = player.x - 120;

            // 💡 [핵심 수정] 캐릭터가 멈춰서 다음 입력을 기다릴 때만 실시간으로 시간이 흐르고 게이지가 줄어듭니다.
            let isWaitingInput = (player.x === player.targetX);

            if (isWaitingInput) {
                timeElapsed += dt;
                
                let gaugePercent = Math.max(0, 100 - (timeElapsed / currentTimeLimit) * 100);
                document.getElementById('gaugeBar').style.width = gaugePercent + '%';

                // 타임아웃 검사
                if (timeElapsed >= currentTimeLimit) {
                    triggerGameOver("시간 안에 이온 통로를 개방하지 못했습니다!");
                    return; 
                }
            } else {
                // 전진하는 짧은 도중에는 게이지를 가득 채워 대기시킵니다.
                document.getElementById('gaugeBar').style.width = '100%';
            }

            // 그래픽 렌더링
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(-cameraX, 0);

            // 1. 뉴런 세포막 선
            ctx.strokeStyle = '#2d325a';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(0, 200);
            ctx.lineTo(player.x + 1000, 200);
            ctx.stroke();

            // 2. 말이집 및 결절/발판
            blocks.forEach((b, idx) => {
                if (b.isMyelin && idx !== currentBlockIndex) {
                    ctx.fillStyle = '#3a3f58';
                    ctx.fillRect(b.x - 120, 185, 100, 30);
                }

                ctx.fillStyle = b.color;
                if (idx === currentBlockIndex) {
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = b.color;
                } else {
                    ctx.shadowBlur = 0;
                }
                
                ctx.fillRect(b.x, 190, 60, 20);
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#000000';
                ctx.font = 'bold 12px sans-serif';
                ctx.fillText(b.type === 'Na' ? 'Na+' : 'K+', b.x + 15, 205);

                if (idx === currentBlockIndex) {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 18px sans-serif';
                    ctx.fillText('▼', b.x + 20, 175);
                }
            });

            // 3. 캐릭터
            ctx.fillStyle = '#00e5ff';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00e5ff';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.restore();
            requestAnimationFrame(animate);
        }

        // 게임 최초 실행
        document.getElementById('timerLabel').innerText = `제한시간 (${(baseTimeLimit/1000).toFixed(2)}초)`;
        lastTime = Date.now();
        animate();
    </script>
</body>
</html>
